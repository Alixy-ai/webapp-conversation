# ============================================================================
#  aks.enaaa.com — conversation web app served from the /chatbot sub-path
#  Server : ixhcserver (<server-ip>)
#  App    : docker compose, published on 127.0.0.1:13001
# ----------------------------------------------------------------------------
#  Install (as root / with sudo):
#     cp aks.enaaa.com.conf /etc/nginx/conf.d/
#     nginx -t && systemctl reload nginx
#
#  HTTPS:
#     certbot --nginx -d aks.enaaa.com     # adds the 443 block itself
#     — or — uncomment the template at the bottom and point it at your files.
# ----------------------------------------------------------------------------
#  Two rules below look fussy on purpose — do not "simplify" them:
#    * `location /chatbot`              NO trailing slash: with `/chatbot/` the
#      bare /chatbot URL misses this block and falls through to `location /`
#    * `proxy_pass http://chatbot_app;` NO URI part: adding a trailing slash
#      strips the /chatbot prefix and the app answers 404 on everything
# ============================================================================

# the app container is published on 127.0.0.1:13001 (see docker-compose.lan-only.yml)
upstream chatbot_app {
    server 127.0.0.1:13001;
    keepalive 32;
}

server {
    listen      80;
    listen [::]:80;
    server_name aks.enaaa.com;

    # http-01 challenge for certbot (webroot). Harmless otherwise.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ---------------------------------------------------------------- app ---
    location /chatbot {
        proxy_pass http://chatbot_app;

        proxy_http_version 1.1;
        # SSE only — this app has no WebSocket. The empty value pairs with the
        # upstream keepalive above.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # becomes "https" once TLS terminates here: the admin session cookie
        # then carries the Secure flag (log in over https, not plain http)
        proxy_set_header X-Forwarded-Proto $scheme;

        # chat answers stream over SSE — buffering holds the whole answer back
        # until it is finished (looks like a hang)
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # attachments / images are uploaded through the app
        client_max_body_size 20m;
    }

    # bare domain → app (the app answers 404 on "/" because it lives under
    # /chatbot, so the redirect has to happen here)
    location = / {
        return 302 /chatbot;
    }

    # this domain serves nothing else
    location / {
        return 404;
    }
}

# ============================================================================
#  HTTPS template — only for the "own certificate" path (skip it with certbot).
#  Uncomment, fix the two certificate paths, keep the same location blocks.
#
#  Once this block is active and you want to force HTTPS, replace the :80
#  `location /chatbot` and `location /` above with
#      location /chatbot { return 301 https://$host$request_uri; }
#      location /          { return 301 https://$host$request_uri; }
#  (keep the ACME location) — or just let certbot manage the redirect.
